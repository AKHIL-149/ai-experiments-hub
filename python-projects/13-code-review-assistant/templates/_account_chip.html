{# Who is signed in, for the pages that do not extend base.html. Set show_logout before including. #}
<span class="account-chip" style="display:inline-flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:#374151;">
    <span class="user-name" style="font-weight:600;">{{ user.username }}</span>
    {% if user.is_guest %}
    <span class="badge-guest" title="Temporary account: it can't be signed back in to after you log out" style="background:#fef3c7;color:#92400e;padding:0.1rem 0.5rem;border-radius:999px;font-size:0.7rem;font-weight:600;text-transform:uppercase;">Guest</span>
    {% endif %}
    {% if show_logout %}
    <a href="/logout" style="color:#2563eb;text-decoration:none;">Logout</a>
    {% endif %}
</span>
